services:
  storage-server:
    image: storageserver:dev
    container_name: storage-server
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_HTTP_PORTS: "8080"
      ASPNETCORE_HTTPS_PORTS: "8081"
    ports:
      - "32798:8080"
      - "32799:8081"
    volumes:
      - C:\Users\ArneMA\AppData\Roaming\DhrMaes\Storage:/home/app/.config/DhrMaes/Storage
    networks:
      - default

networks:
  default:
    driver: bridge
