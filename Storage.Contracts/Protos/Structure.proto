syntax = "proto3";

package dhrmaes.storage.protobuf.structure.v1;

option csharp_namespace = "DhrMaes.Storage.Protobuf.Structure.v1";

message StorageNode {
  oneof node_type {
    FileNode file = 1;
    DirectoryNode directory = 2;
  }
}

message FileNode {
  string name = 1;
  int64 size = 2;
}

message DirectoryNode {
  string name = 1;
  repeated StorageNode children = 2;
}
